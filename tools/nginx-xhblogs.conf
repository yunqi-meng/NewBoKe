# 公开站 + 控制台同域反向代理
#
# 安装位置：/etc/nginx/conf.d/xhblogs.conf
#
# 拓扑：
#   http(s)://<域名>/          → 127.0.0.1:8080（XHBlogs 公开站，next start）
#   http(s)://<域名>/console   → 127.0.0.1:3001（my-blog-manager 控制台，standalone）
#   后端 127.0.0.1:8000 只给两个前端内部调用，不对外暴露。
#
# 两个容易踩的点：
#   1. 控制台的 location 不能写成 `proxy_pass http://127.0.0.1:3001/;`
#      —— 末尾带斜杠会把 /console 前缀剥掉。控制台的 Next 构建带了
#      basePath=/console，内部路由就是按「带前缀」注册的，剥掉等于全部 404。
#   2. location /console 必须写在 location / 前面（前缀匹配按最长匹配，其实顺序
#      不影响，但写在一起时保持这个顺序可读性最好）。
#
# 还差的两步（需要域名）：
#   - 把 server_name 换成真实域名（根域和 www 都写上）；
#   - 申请证书后启用下面的 443 段，并把 80 段改为 301 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ← 域名接入后改成 example.com www.example.com

    # 音乐、封面、缩略图都是整文件上传，默认 1m 不够
    client_max_body_size 64m;

    # 压缩：Next 自己不带 gzip，交给 nginx
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 控制台：保留 /console 前缀原样转发
    location /console {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 公开站
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

